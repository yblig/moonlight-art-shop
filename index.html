<style>
:root{
  --night:#0f1626; --night-2:#172238; --night-3:#22304d;
  --moon:#e9c98b; --moon-soft:#f4e4c1; --cream:#faf6ee; --paper:#fffdf8;
  --ink:#1d2333; --muted:#5d6577; --line:#e7dfd0;
  --wa:#1fa855;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{width:min(1100px,100% - 40px);margin-inline:auto}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#9a7b3f}

/* ---------- top bar ---------- */
.top{position:absolute;inset:0 0 auto;z-index:5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;color:var(--moon-soft);text-decoration:none;font-family:"Cormorant Garamond",serif;font-size:1.35rem;font-weight:600}
.brand svg{width:30px;height:30px}
.lang{display:flex;border:1px solid rgba(233,201,139,.4);border-radius:99px;overflow:hidden;background:rgba(15,22,38,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lang button{background:none;border:0;color:var(--moon-soft);font:inherit;font-size:.78rem;font-weight:700;padding:6px 12px;cursor:pointer;letter-spacing:.06em}
.lang button.on{background:var(--moon);color:var(--night)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:var(--cream);background:
  radial-gradient(1200px 500px at 80% -10%,#2b3c63 0%,transparent 60%),
  linear-gradient(180deg,var(--night) 0%,var(--night-2) 100%);
  padding:120px 0 90px}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.55;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
.moon{position:absolute;right:max(4vw,20px);top:90px;width:clamp(140px,26vw,300px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fff8e6 0%,var(--moon-soft) 38%,var(--moon) 75%,#c9a35f 100%);
  box-shadow:0 0 80px 20px rgba(233,201,139,.22),0 0 220px 60px rgba(233,201,139,.10)}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(170,130,70,.18)}
.moon::before{width:18%;height:18%;left:56%;top:28%}
.moon::after{width:11%;height:11%;left:30%;top:60%}
.hero .wrap{position:relative;z-index:2}
.hero h1{font-size:clamp(2.7rem,8vw,5.4rem);max-width:11ch;margin:14px 0 18px}
.hero h1 em{font-style:italic;color:var(--moon)}
.hero .eyebrow{color:var(--moon)}
.hero p.lead{max-width:46ch;font-size:clamp(1rem,2.4vw,1.15rem);color:#d5d9e4}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:99px;font-weight:700;text-decoration:none;font-size:.98rem;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:20px;height:20px;flex:none}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 8px 24px -8px rgba(31,168,85,.6)}
.btn-ghost{border:1.5px solid rgba(233,201,139,.55);color:var(--moon-soft)}
.btn-dark{background:var(--night);color:var(--cream)}
.btn-light{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.quick{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:38px;font-size:.92rem;color:#b9bfcd}
.quick span{display:flex;align-items:center;gap:8px}
.quick svg{width:16px;height:16px;color:var(--moon)}

/* ---------- sections ---------- */
section{padding:84px 0}
.head{max-width:620px;margin-bottom:40px}
.head h2{font-size:clamp(2.1rem,5vw,3.1rem);margin:10px 0 12px}
.head p{color:var(--muted)}

/* about / categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.cat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.cat .ic{width:46px;height:46px;border-radius:12px;background:var(--night);display:grid;place-items:center;margin-bottom:16px}
.cat .ic svg{width:24px;height:24px;color:var(--moon)}
.cat h3{font-size:1.45rem;margin-bottom:6px}
.cat p{color:var(--muted);font-size:.95rem}

/* products */
.products{background:var(--paper);border-block:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{display:block;width:100%;padding:0;border:0;cursor:zoom-in;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:var(--night-3);transition:transform .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.tile:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(15,22,38,.45)}
.tile img,.tile svg{width:100%;height:100%;object-fit:cover;display:block}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.97);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:60px 16px}
.lb.open{display:flex}
body.lb-on .fab{display:none}
.lb-img{width:min(900px,100%);max-height:100%;border-radius:14px;overflow:hidden}
.lb-img img,.lb-img svg{width:100%;height:auto;max-height:80vh;object-fit:contain;display:block;margin:auto}
.lb button{position:absolute;background:rgba(255,255,255,.1);color:#fff;border:0;width:46px;height:46px;border-radius:50%;font-size:1.5rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.lb-close{top:14px;right:14px}
.lb-prev{left:12px;top:50%;transform:translateY(-50%)}
.lb-next{right:12px;top:50%;transform:translateY(-50%)}

/* visit */
.visit-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:22px;align-items:stretch}
.info{background:var(--night);color:var(--cream);border-radius:var(--radius);padding:30px;display:flex;flex-direction:column;gap:22px}
.info h3{font-size:1.9rem;color:var(--moon-soft)}
.row{display:flex;gap:14px}
.row .ic{width:40px;height:40px;flex:none;border-radius:10px;background:var(--night-3);display:grid;place-items:center}
.row .ic svg{width:20px;height:20px;color:var(--moon)}
.row small{display:block;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:#98a0b3;font-weight:700}
.row b,.row a{font-weight:500;color:var(--cream);text-decoration:none}
.row a:hover{text-decoration:underline}
.hours{list-style:none;font-size:.95rem}
.hours li{display:flex;justify-content:space-between;gap:12px}
.info .cta{margin-top:auto}
.map{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);min-height:380px;background:var(--night-3)}
.map iframe{width:100%;height:100%;min-height:380px;border:0;display:block}

/* footer */
footer{background:var(--night);color:#98a0b3;padding:36px 0 110px;font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}
footer .brand{font-size:1.2rem}

/* floating WA */
.fab{position:fixed;right:18px;bottom:18px;z-index:20;width:60px;height:60px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 30px -8px rgba(31,168,85,.7);transition:transform .15s}
.fab:hover{transform:scale(1.06)}
.fab svg{width:30px;height:30px;color:#fff}

@media (max-width:820px){
  .visit-grid{grid-template-columns:1fr}
  .hero{padding:104px 0 70px}
  .moon{top:70px;right:-30px;opacity:.9}
  section{padding:64px 0}
}
@media (max-width:640px){
  .wrap{width:calc(100% - 32px)}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .tile{border-radius:14px}
  .cats{grid-template-columns:1fr 1fr;gap:10px}
  .cat{padding:16px;border-radius:14px}
  .cat .ic{width:38px;height:38px;border-radius:10px;margin-bottom:12px}
  .cat .ic svg{width:20px;height:20px}
  .cat h3{font-size:1.2rem}
  .cat p{font-size:.84rem;line-height:1.45}
  .head{margin-bottom:26px}
  .info{padding:22px}
  .map,.map iframe{min-height:300px}
  .lb-prev,.lb-next{top:auto!important;bottom:18px;transform:none!important}
  .lb-prev{left:calc(50% - 56px)!important}
  .lb-next{right:calc(50% - 56px)!important}
}
@media (max-width:520px){
  .hero{padding:96px 0 56px}
  .moon{width:150px;top:-36px;right:-46px}
  .hero h1{margin-top:10px;max-width:none;font-size:clamp(2.4rem,11vw,3rem)}
  .moon{opacity:.75}
  .cta{margin-top:26px}
  .cta .btn{flex:1 1 100%;justify-content:center;padding:15px 16px;white-space:nowrap}
  .quick{flex-direction:column;gap:8px;margin-top:26px}
  footer .wrap{flex-direction:column;align-items:flex-start}
}
@media (max-width:360px){
  .cats{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

      ["i-gift","Kerajinan & Souvenir","Anyaman, pernak-pernik, dan oleh-oleh khas untuk dibawa pulang."]
    ]
  },
  en: {

    heroTitle: "Art for <em>every corner</em> of your home",
    heroLead: "Moonlight Art Shop carries paintings, carvings, statues and handpicked handicrafts. Drop by the shop or message us on WhatsApp first.",
    ctaChat: "Chat on WhatsApp", ctaMap: "See location", ctaDirections: "Get directions",
    aboutEyebrow: "About us", aboutTitle: "What we sell",
    aboutText: "We bring together work by local artists and artisans, from small souvenirs to statement pieces for your home, office or villa.",
    prodEyebrow: "Featured products", prodTitle: "A few of our pieces",
    prodText: "A few examples of what you'll find in our shop.",
    close: "Close",
    visitEyebrow: "Visit us", visitTitle: "Address & contact",

    waMsg: "Hi Moonlight Art Shop, I have a question.",
    cats: [
      ["i-brush","Paintings","Canvas paintings in many styles: landscapes, abstracts and traditional motifs."],

};

/* ---------- ilustrasi bawaan (dipakai kalau foto belum ada) ---------- */
const ART = {
  paint:`<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#22304d"/><rect x="70" y="40" width="260" height="200" fill="#c9a35f"/><rect x="82" y="52" width="236" height="176" fill="#f4e4c1"/><rect x="82" y="52" width="236" height="110" fill="#e9b97a"/><circle cx="250" cy="105" r="26" fill="#fff4d6"/><path d="M82 170l50-40 40 30 50-50 96 70v48H82z" fill="#5b7a5a"/><path d="M82 195l70-30 60 25 106-20v58H82z" fill="#3e5a46"/><rect x="190" y="240" width="20" height="40" fill="#8a6a3c"/></svg>`,
  mask:`<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#2b2420"/><ellipse cx="200" cy="150" rx="88" ry="112" fill="#a8743f"/><ellipse cx="200" cy="150" rx="74" ry="98" fill="#c08a4e"/><path d="M140 125q25-22 48 0q-24 14-48 0zM212 125q25-22 48 0q-24 14-48 0z" fill="#2b2420"/><path d="M200 135v40l-12 8h24l-12-8" stroke="#7a5230" stroke-width="5" fill="none"/><path d="M160 205q40 28 80 0q-40 10-80 0z" fill="#7a2f22"/><path d="M130 85q70-50 140 0" stroke="#e9c98b" stroke-width="7" fill="none"/><circle cx="200" cy="62" r="9" fill="#e9c98b"/></svg>`,
  statue:`<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#2f3a3a"/><rect x="140" y="245" width="120" height="30" rx="4" fill="#5c6766"/><circle cx="200" cy="80" r="30" fill="#9aa39f"/><path d="M200 112c-38 0-56 30-56 70 0 22 14 40 30 52h52c16-12 30-30 30-52 0-40-18-70-56-70z" fill="#8c9692"/><path d="M168 175q32 26 64 0" stroke="#6f7a76" stroke-width="6" fill="none"/><path d="M180 140q20 12 40 0" stroke="#6f7a76" stroke-width="5" fill="none"/><path d="M178 52q22-30 44 0" stroke="#e9c98b" stroke-width="6" fill="none"/></svg>`,
  craft:`<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#3a2e22"/><g fill="none" stroke-width="10"><path d="M110 120h180l-20 130H130z" fill="#c69a5a" stroke="none"/><path d="M118 150h164M122 180h156M126 210h148M130 240h140" stroke="#9c7440"/><path d="M150 120v130M190 120v130M230 120v130M270 120v130" stroke="#e1bf80" stroke-width="8"/></g><path d="M140 120q60-80 120 0" stroke="#8a6332" stroke-width="10" fill="none"/></svg>`,

  gift:`<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#2a2440"/><circle cx="135" cy="185" r="48" fill="#c25b4a"/><path d="M135 137v96M87 185h96" stroke="#e9c98b" stroke-width="5"/><rect x="200" y="120" width="110" height="110" rx="10" fill="#4f7a6e"/><path d="M255 120v110M200 175h110" stroke="#f4e4c1" stroke-width="8"/><path d="M255 120q-22-30-34-10t34 10q22-30 34-10t-34 10" fill="#f4e4c1"/><rect x="60" y="232" width="280" height="10" rx="5" fill="#3d3560"/></svg>`
};

/* ---------- render ---------- */
let lang = "id";
try {
  const saved = localStorage.getItem("ml-lang");
  if (saved) lang = saved;
} catch(e) {}
if (!T[lang]) lang = "id";

const wa = msg => `https://wa.me/${TOKO.telepon}?text=${encodeURIComponent(msg)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));

  document.querySelectorAll(".js-wa").forEach(a => a.href = wa(t.waMsg));
  document.querySelectorAll(".js-area").forEach(el => el.textContent = TOKO.area);
  document.querySelector(".js-hours-short").textContent = TOKO.jamSingkat[lang];
  document.querySelector(".js-address").textContent = TOKO.alamat;
  const tel = document.querySelector(".js-tel");
  tel.textContent = TOKO.teleponTampil; tel.href = "tel:+" + TOKO.telepon;
  document.querySelector(".js-hours").innerHTML = TOKO.jam.map(j => `<li><span>${esc(j[lang])}</span><b>${esc(j.jam)}</b></li>`).join("");

  document.getElementById("cats").innerHTML = t.cats.map(([ic,h,p]) =>
    `<div class="cat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#${ic}"/></svg></div><h3>${h}</h3><p>${p}</p></div>`).join("");

  document.getElementById("grid").innerHTML = TOKO.galeri.map((p, i) =>
    `<button class="tile" data-i="${i}" aria-label="${lang === "id" ? "Perbesar foto" : "Enlarge photo"} ${i + 1}">${media(p)}</button>`
  ).join("");
  document.querySelector(".lb-close").setAttribute("aria-label", t.close);
}

const media = p => p.foto ? `<img src="${esc(p.foto)}" alt="" loading="lazy">` : (ART[p.art] || ART.paint);

/* ---------- lightbox (ketuk foto untuk memperbesar, geser untuk ganti) ---------- */
const lb = document.getElementById("lb"), lbImg = lb.querySelector(".lb-img");
let cur = 0, startX = null;
function openLb(i){ cur = (i + TOKO.galeri.length) % TOKO.galeri.length; lbImg.innerHTML = media(TOKO.galeri[cur]); lb.classList.add("open"); document.body.classList.add("lb-on"); document.body.style.overflow = "hidden"; }
function closeLb(){ lb.classList.remove("open"); document.body.classList.remove("lb-on"); document.body.style.overflow = ""; }
document.getElementById("grid").addEventListener("click", e => { const b = e.target.closest(".tile"); if (b) openLb(+b.dataset.i); });
lb.querySelector(".lb-close").onclick = closeLb;
lb.querySelector(".lb-prev").onclick = () => openLb(cur - 1);
lb.querySelector(".lb-next").onclick = () => openLb(cur + 1);
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
lb.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, {passive:true});
lb.addEventListener("touchend", e => { if (startX === null) return; const dx = e.changedTouches[0].clientX - startX; if (Math.abs(dx) > 40) openLb(cur + (dx < 0 ? 1 : -1)); startX = null; });
document.addEventListener("keydown", e => { if (!lb.classList.contains("open")) return; if (e.key === "Escape") closeLb(); if (e.key === "ArrowRight") openLb(cur + 1); if (e.key === "ArrowLeft") openLb(cur - 1); });

// peta
const q = encodeURIComponent(TOKO.cariDiMaps);
document.querySelector(".js-embed").src = `https://www.google.com/maps?q=${q}&output=embed`;
document.querySelector(".js-maps").href = TOKO.linkMaps || `https://www.google.com/maps/search/?api=1&query=${q}`;

// bintang
const stars = document.getElementById("stars");
for (let i = 0; i < 70; i++) {
  const s = document.createElement("i");
  s.style.left = Math.random()*100 + "%"; s.style.top = Math.random()*100 + "%";
  s.style.animationDelay = (Math.random()*4).toFixed(2) + "s";
  if (Math.random() > .85) { s.style.width = s.style.height = "3px"; }
  stars.appendChild(s);
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("ml-lang", lang); } catch(e) {} render();
}));
document.getElementById("yr").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
