<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonlight Art Shop</title>
<meta name="description" content="Moonlight Art Shop: vas keramik, gerabah, guci, dan dekorasi interior buatan tangan. Art shop kami di Batubulan, Bali, pesan langsung lewat WhatsApp.">
<meta property="og:title" content="Moonlight Art Shop">
<meta property="og:description" content="Vas keramik, gerabah & dekorasi interior buatan tangan dari Bali. Pesan langsung lewat WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://yblig.github.io/moonlight-art-shop/images/og-cover.jpg">
<meta property="og:url" content="https://yblig.github.io/moonlight-art-shop/">
<meta name="theme-color" content="#14100d">
<link rel="icon" type="image/png" href="images/icon-180.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --n0:#0d0a08; --n1:#14100d; --n2:#1c1713; --n3:#2a221c; --n4:#3b3027;
  --gold:#e9c98b; --gold-2:#f6e7c6; --gold-3:#b8914f;
  --cream:#f5eee3; --paper:#fbf7f0; --ink:#231c16; --muted:#6c6157; --line:#e6dccb; --clay:#8d663f; --sand:#d9c3a5;
  --wa:#1fa855; --wa-2:#25d366;
  --r:22px; --r-sm:14px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;-webkit-tap-highlight-color:transparent}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.wrap{width:min(1160px,100% - 48px);margin-inline:auto}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.04;letter-spacing:-.015em}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--gold-3)}
.eyebrow::before{content:"";width:26px;height:1.5px;background:currentColor;opacity:.7}

/* =========================================================
   LOADER
   ========================================================= */
.loader{position:fixed;inset:0;z-index:100;background:var(--n1);display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
.loader.done{opacity:0;visibility:hidden}
.loader-in{display:flex;flex-direction:column;align-items:center;gap:18px}
.l-moon{width:84px;height:84px;border-radius:50%;box-shadow:0 0 60px 10px rgba(233,201,139,.3);animation:lrise 1.1s var(--ease-out) both}
.loader span{font-family:Montserrat,sans-serif;font-weight:700;font-size:1.35rem;color:#fff;letter-spacing:.02em;animation:lfade 1s .25s var(--ease) both}
@keyframes lrise{from{transform:translateY(30px) scale(.6);opacity:0}}
@keyframes lfade{from{opacity:0;transform:translateY(8px)}}

/* =========================================================
   TOP PROGRESS + NAV
   ========================================================= */
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;background:linear-gradient(90deg,var(--gold-3),var(--gold),var(--gold-2));transform-origin:0 50%;transform:scaleX(0)}
.nav{position:fixed;top:0;left:0;right:0;z-index:40;transition:background .4s,box-shadow .4s,transform .4s var(--ease)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.nav.solid{background:rgba(20,16,13,.86);box-shadow:0 10px 30px -20px rgba(0,0,0,.6)}
@supports (backdrop-filter:blur(1px)){ @media (pointer:fine){ .nav.solid{background:rgba(20,16,13,.66);backdrop-filter:blur(14px) saturate(1.4)} } }
.brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-family:Montserrat,"DM Sans",sans-serif;font-size:1.22rem;font-weight:700;letter-spacing:.005em;white-space:nowrap}
.brand img{width:36px;height:36px;flex:none;border-radius:50%;box-shadow:0 0 0 3px rgba(233,201,139,.18),0 6px 18px -6px rgba(0,0,0,.6)}
.links{display:flex;gap:6px;align-items:center}
.links a{color:#c9cfdc;text-decoration:none;font-size:.92rem;font-weight:500;padding:8px 14px;border-radius:99px;transition:color .2s,background .2s}
.links a:hover{color:#fff;background:rgba(255,255,255,.06)}
.links a.wa-mini{background:var(--wa);color:#fff;font-weight:700;margin-left:6px}
.nav-r{display:flex;align-items:center;gap:12px}
.lang{position:relative;display:flex;border:1px solid rgba(233,201,139,.35);border-radius:99px;padding:3px;background:rgba(13,10,8,.6)}
.lang button{position:relative;z-index:1;background:none;border:0;color:var(--gold-2);font-size:.74rem;font-weight:700;width:38px;height:28px;cursor:pointer;letter-spacing:.06em;transition:color .3s}
.lang button.on{color:var(--n1)}
.lang .pill{position:absolute;top:3px;left:3px;width:38px;height:28px;border-radius:99px;background:var(--gold);transition:transform .45s var(--ease-out)}
.lang.en .pill{transform:translateX(38px)}

/* =========================================================
   HERO
   ========================================================= */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;overflow:hidden;color:var(--cream);
  background:radial-gradient(120% 80% at 75% 10%,#3a2c20 0%,transparent 55%),radial-gradient(80% 60% at 10% 100%,#2a1d16 0%,transparent 60%),linear-gradient(180deg,var(--n1) 0%,var(--n2) 100%);isolation:isolate}
section.hero{padding:0}
.hero.off *{animation-play-state:paused!important}
.sky{position:absolute;inset:0;z-index:-3;pointer-events:none}
.stars{position:absolute;top:0;left:0;width:1px;height:1px;border-radius:50%;background:transparent}
.s1{animation:tw 5s ease-in-out infinite}
.s2{animation:tw 7s 1.5s ease-in-out infinite}
.s3{width:2px;height:2px;animation:tw 4s .8s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.shoot{position:absolute;width:140px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,.95),transparent);opacity:0;transform-origin:0 50%;animation:shoot 9s linear infinite}
.shoot:nth-child(4){top:12%;left:58%;animation-delay:2s}
.shoot:nth-child(5){top:26%;left:30%;animation-delay:6.5s;animation-duration:12s}
.shoot:nth-child(6){top:8%;left:84%;animation-delay:10s;animation-duration:14s}
@keyframes shoot{0%{opacity:0;transform:rotate(155deg) translateX(0) scaleX(.3)}2%{opacity:1}8%{opacity:0;transform:rotate(155deg) translateX(360px) scaleX(1)}100%{opacity:0;transform:rotate(155deg) translateX(360px)}}

.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.arch-wrap{position:relative;justify-self:end;width:min(100%,400px,calc((100svh - 200px)/1.37));aspect-ratio:3/4.1;will-change:transform}
.moon-wrap{position:absolute;z-index:-1;right:-16%;top:-12%;width:62%;aspect-ratio:1;will-change:transform}
.arch{position:absolute;inset:0;border-radius:999px 999px 26px 26px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.75),0 0 0 1px rgba(233,201,139,.25);clip-path:inset(100% 0 0 0 round 999px 999px 26px 26px);transition:clip-path 1.6s var(--ease-out) .35s}
.ready .arch{clip-path:inset(0 0 0 0 round 999px 999px 26px 26px)}
.arch img{width:100%;height:100%;object-fit:cover;transform:scale(1.18);transition:transform 2.4s var(--ease-out) .35s}
.ready .arch img{transform:scale(1.02)}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(20,16,13,.35))}
.arch-line{position:absolute;inset:-14px;border:1px solid rgba(233,201,139,.35);border-radius:999px 999px 34px 34px;pointer-events:none;opacity:0;transform:scale(.96);transition:opacity 1s 1.2s,transform 1.4s var(--ease-out) 1.2s}
.ready .arch-line{opacity:1;transform:none}
.badge{position:absolute;left:-34px;bottom:46px;background:rgba(251,247,240,.96);color:var(--ink);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 40px -18px rgba(0,0,0,.6);opacity:0;transform:translateY(16px);transition:opacity .8s 1.5s,transform .9s var(--ease-out) 1.5s;animation:mfloat 6s 3s ease-in-out infinite}
.ready .badge{opacity:1;transform:none}
.badge b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.25rem;line-height:1.1}
.badge small{color:var(--muted);font-size:.76rem}
.badge .bi{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--clay),#8d6040);display:grid;place-items:center;color:#fff}
.badge .bi svg{width:22px;height:22px}
.moon{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fffaf0 0%,#f8e8c4 30%,var(--gold) 68%,#c39b57 100%);
  box-shadow:inset -18px -22px 50px rgba(150,105,45,.35),0 0 0 1px rgba(255,240,210,.12);animation:mfloat 9s ease-in-out infinite}
.moon i{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(160,118,60,.10),rgba(160,118,60,.28))}
.moon i:nth-child(1){width:20%;height:20%;left:56%;top:24%}
.moon i:nth-child(2){width:12%;height:12%;left:28%;top:58%}
.moon i:nth-child(3){width:8%;height:8%;left:62%;top:62%}
.moon i:nth-child(4){width:6%;height:6%;left:38%;top:30%}
.halo{position:absolute;inset:-45%;border-radius:50%;background:radial-gradient(circle,rgba(233,201,139,.28) 0%,rgba(233,201,139,.10) 35%,transparent 65%);animation:pulse 6s ease-in-out infinite}
.ring{position:absolute;inset:-14%;border-radius:50%;border:1px solid rgba(233,201,139,.18);animation:spin 40s linear infinite}
.ring::after{content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;border-radius:50%;background:var(--gold-2);box-shadow:0 0 12px 2px rgba(246,231,198,.8)}
@keyframes mfloat{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
@keyframes spin{to{transform:rotate(360deg)}}

.dust{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.dust b{position:absolute;bottom:-10px;width:var(--s,4px);height:var(--s,4px);border-radius:50%;background:var(--gold-2);box-shadow:0 0 8px 1px rgba(246,231,198,.7);opacity:0;animation:rise var(--t,12s) var(--d,0s) linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:.9}90%{opacity:.6}100%{transform:translate3d(var(--x,20px),-95vh,0);opacity:0}}

.hills{position:absolute;left:0;right:0;bottom:-1px;z-index:-1;pointer-events:none}
.hills svg{position:absolute;left:0;bottom:0;width:100%;height:auto;will-change:transform}
.hills{height:100%}

.hero-grid{position:relative;padding:110px 0 140px}
.hero-in{position:relative;will-change:transform,opacity}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:clamp(2.8rem,5.6vw,5rem);max-width:12ch;margin:18px 0 20px}
.hero h1 em{font-style:italic;color:var(--gold);font-weight:500;background:linear-gradient(100deg,var(--gold) 20%,#fff3d6 45%,var(--gold) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheen 6s 2s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em;margin-bottom:-.06em}
.w>span{display:inline-block;transform:translateY(110%);transition:transform 1s var(--ease-out);transition-delay:calc(var(--i)*70ms + .1s)}
.ready .w>span{transform:none}
.lead{max-width:44ch;font-size:clamp(1rem,2.2vw,1.16rem);color:#c8cedb}
.fade-up{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease-out);transition-delay:var(--dl,.6s)}
.ready .fade-up{opacity:1;transform:none}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;border-radius:99px;font-weight:700;text-decoration:none;font-size:.98rem;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s,background .25s,color .25s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn[hidden]{display:none}
.btn svg{width:20px;height:20px;flex:none}
.btn-wa{background:linear-gradient(135deg,var(--wa-2),var(--wa));color:#fff;box-shadow:0 12px 30px -10px rgba(31,168,85,.7)}
.btn-wa::after{content:"";position:absolute;top:0;left:0;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-120%) skewX(-20deg);animation:shine 4.5s 2.5s ease-in-out infinite}
@keyframes shine{0%,70%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(260%) skewX(-20deg)}}
.btn-ghost{border:1.5px solid rgba(233,201,139,.5);color:var(--gold-2)}
@media (hover:hover){.btn:hover{transform:translateY(-3px)}.btn-ghost:hover{background:rgba(233,201,139,.1)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:.86rem;color:#d3d8e3}
.chip svg{width:15px;height:15px;color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:#8a93a8;position:relative;flex:none}
.dot.open{background:var(--wa-2)}
.dot.open::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--wa-2);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.7);opacity:0}}

.scroll-hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:#8f98ad;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;z-index:2}
.scroll-hint i{width:22px;height:36px;border:1.5px solid rgba(233,201,139,.45);border-radius:12px;position:relative}
.scroll-hint i::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold);animation:wheel 1.8s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(11px);opacity:0}100%{opacity:0}}

/* =========================================================
   MARQUEE
   ========================================================= */
.marquee{background:var(--n0);color:var(--gold-2);overflow:hidden;padding:18px 0;border-bottom:1px solid rgba(233,201,139,.12)}
.track{display:flex;width:max-content;animation:slide 32s linear infinite}
.track span{display:flex;align-items:center;gap:28px;padding-right:28px;font-family:"Cormorant Garamond",serif;font-size:clamp(1.4rem,3.6vw,2.1rem);font-style:italic;white-space:nowrap}
.track span::after{content:"✦";font-style:normal;font-size:.7em;color:var(--gold-3)}
@keyframes slide{to{transform:translateX(-50%)}}
.marquee.off .track{animation-play-state:paused}

/* =========================================================
   SECTIONS
   ========================================================= */
section{position:relative;padding:110px 0}
.head{max-width:640px;margin-bottom:48px}
.head h2{font-size:clamp(2.4rem,5.6vw,3.8rem);margin:14px 0 14px}
.head h2 em{font-style:italic;color:var(--gold-3);font-weight:500}
.head p{color:var(--muted);font-size:1.04rem}
.head.center{text-align:center;margin-inline:auto}
.head.center .eyebrow::after{content:"";width:26px;height:1.5px;background:currentColor;opacity:.7}

/* reveal on scroll */
[data-r]{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform 1s var(--ease-out);transition-delay:calc(var(--k,0)*90ms)}
[data-r="scale"]{transform:scale(.92) translateY(20px)}
[data-r="left"]{transform:translateX(-40px)}
[data-r="right"]{transform:translateX(40px)}
[data-r].in{opacity:1;transform:none}

/* about */
.about{background:var(--cream);overflow:hidden}
.about::before{content:"";position:absolute;width:520px;height:520px;right:-180px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(233,201,139,.28),transparent 65%);pointer-events:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.cat{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px 26px;overflow:hidden;transform-style:preserve-3d;transition:box-shadow .4s,border-color .4s}
.cat::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(233,201,139,.22),transparent 45%);opacity:0;transition:opacity .4s}
.cat:hover{box-shadow:0 30px 60px -34px rgba(35,28,22,.45);border-color:#e2cfa5}
.cat:hover::before{opacity:1}
.cat .num{position:absolute;top:18px;right:22px;font-family:"Cormorant Garamond",serif;font-size:2.6rem;font-weight:600;color:rgba(184,145,79,.16);line-height:1}
.cat .ic{position:relative;width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,var(--n2),var(--n4));display:grid;place-items:center;margin-bottom:22px;box-shadow:0 12px 24px -12px rgba(20,16,13,.7)}
.cat .ic svg{width:26px;height:26px;color:var(--gold)}
.cat .ic svg *{stroke-dasharray:80;stroke-dashoffset:80;transition:stroke-dashoffset 1.6s var(--ease) calc(var(--k,0)*120ms + .3s)}
.cat.in .ic svg *{stroke-dashoffset:0}
.cat h3{position:relative;font-size:1.6rem;margin-bottom:8px}
.cat p{position:relative;color:var(--muted);font-size:.95rem}

/* gallery */
.gallery{background:var(--paper);border-top:1px solid var(--line)}
.bento{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:clamp(180px,22vw,270px);gap:16px;grid-auto-flow:dense}
.bento .tile:nth-child(6n+1){grid-column:span 2;grid-row:span 2}
.tile{position:relative;display:block;width:100%;height:100%;padding:0;border:0;cursor:zoom-in;border-radius:var(--r);overflow:hidden;background:var(--n3);isolation:isolate}
.tile .media{position:absolute;inset:0;transition:transform 1.1s var(--ease-out)}
.tile .media img,.tile .media svg{width:100%;height:100%;object-fit:cover;display:block}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);background:linear-gradient(180deg,transparent 55%,rgba(13,10,8,.55));opacity:.6;transition:opacity .4s;z-index:1}
.tile .zoom{position:absolute;right:14px;bottom:14px;z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,252,246,.92);color:var(--ink);display:grid;place-items:center;transform:scale(.6);opacity:0;transition:transform .45s var(--ease-out),opacity .3s}
.tile .zoom svg{width:18px;height:18px}
@media (hover:hover){
  .tile:hover .media{transform:scale(1.07)}
  .tile:hover::after{opacity:1}
  .tile:hover .zoom{transform:none;opacity:1}
}
@media (hover:none){ .tile .zoom{transform:none;opacity:.95;width:34px;height:34px;right:10px;bottom:10px} .tile .zoom svg{width:15px;height:15px} }
.tile .media{background:linear-gradient(100deg,var(--n3) 30%,var(--n4) 50%,var(--n3) 70%);background-size:300% 100%;animation:sk 1.6s linear infinite}
@keyframes sk{to{background-position:-150% 0}}
.tile img{opacity:0;transition:opacity .6s}
.tile img.ok{opacity:1}

/* visit */
.visit{background:radial-gradient(80% 60% at 90% 0%,#3a2c20 0%,transparent 60%),linear-gradient(180deg,var(--n1),var(--n0));color:var(--cream);overflow:hidden}
.visit .head p{color:#a9b1c3}
.visit .head h2 em{color:var(--gold)}
.visit-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:22px;align-items:stretch}
.info{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(233,201,139,.18);border-radius:var(--r);padding:32px;display:flex;flex-direction:column;gap:24px;overflow:hidden}
.info::before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(233,201,139,.22),transparent 65%)}
.info-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.info h3{font-size:2rem;color:var(--gold-2)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.06);color:#c9cfdc}
.status.open{background:rgba(37,211,102,.12);color:#6ee7a0}
.row{display:flex;gap:16px;position:relative}
.row .ic{width:44px;height:44px;flex:none;border-radius:13px;background:rgba(233,201,139,.1);border:1px solid rgba(233,201,139,.2);display:grid;place-items:center}

const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wa = msg => `https://wa.me/${TOKO.telepon}?text=${encodeURIComponent(msg)}`;
const fmt = s => s.replace(":", ".");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lang = "id";
try { const s = localStorage.getItem("ml-lang"); if (s && s in {id:1,en:1}) lang = s; } catch(e) {}

/* hero title with word reveal */
function titleHTML(str){
  let em = false, i = 0;
  return str.split(" ").map(w => {
    let start = w.startsWith("*"), end = w.endsWith("*");
    w = w.replace(/\*/g, "");
    if (start) em = true;
    const inner = em ? `<em>${esc(w)}</em>` : esc(w);
    if (end) em = false;
    return `<span class="w"><span style="--i:${i++}">${inner}</span></span>`;
  }).join(" ");
}

const media = (p, eager) => `<img src="${esc(p.foto)}" alt="" ${eager ? "" : 'loading="lazy"'} decoding="async" onload="this.classList.add('ok')">`;

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $$("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  $("#heroTitle").innerHTML = titleHTML(t.heroTitle);
  $$("#lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  $("#lang").classList.toggle("en", lang === "en");

  $$(".js-wa").forEach(a => a.href = wa(t.waMsg));
  $$(".js-area").forEach(el => el.textContent = TOKO.area);
  $$(".js-phone").forEach(a => a.textContent = TOKO.teleponTampil);
  $(".js-studio").textContent = t.studio(TOKO.area);
  $(".js-address").textContent = TOKO.alamat;
  $("#steps").innerHTML = t.steps.map(([h,p],k) => `<li class="step" style="--k:${k}"><span class="n">${k+1}</span><div><h4>${h}</h4><p>${p}</p></div></li>`).join("");
  if (lb.classList.contains("open")) $("#lbWa").href = wa(t.lbMsg(cur+1));

  const words = t.marquee.map(w => `<span>${esc(w)}</span>`).join("");
  $("#track").innerHTML = words + words + words + words;

  $("#cats").innerHTML = t.cats.map(([ic,h,p],k) =>
    `<article class="cat" data-r style="--k:${k}"><span class="num">0${k+1}</span><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[ic]}</svg></div><h3>${h}</h3><p>${p}</p></article>`).join("");

  $("#grid").innerHTML = TOKO.galeri.map((p,i) =>
    `<button class="tile" data-r="scale" style="--k:${i%3}" data-i="${i}" aria-label="${t.enlarge} ${i+1}"><span class="media">${media(p)}</span><span class="zoom"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg></span></button>`).join("");

  observeReveal();
  bindTilt();
}

/* reveal on scroll */
let rio;
function observeReveal(){
  if (reduce || !("IntersectionObserver" in window)) { $$("[data-r]").forEach(el => el.classList.add("in")); return; }
  rio = rio || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); rio.unobserve(e.target); } }), { rootMargin:"0px 0px -8% 0px", threshold:.12 });
  $$("[data-r]:not(.in)").forEach(el => rio.observe(el));
}

/* spotlight + tilt on category cards (mouse only) */
function bindTilt(){
  if (!matchMedia("(hover:hover) and (pointer:fine)").matches || reduce) return;
  $$(".cat").forEach(c => {
    c.addEventListener("pointermove", e => {
      const r = c.getBoundingClientRect(), x = (e.clientX - r.left)/r.width, y = (e.clientY - r.top)/r.height;
      c.style.setProperty("--mx", x*100 + "%"); c.style.setProperty("--my", y*100 + "%");
      c.style.transform = `perspective(800px) rotateX(${(.5-y)*7}deg) rotateY(${(x-.5)*9}deg) translateY(-4px)`;
    });
    c.addEventListener("pointerleave", () => { c.style.transform = ""; });
    c.style.transition = "transform .5s cubic-bezier(.16,1,.3,1), box-shadow .4s, border-color .4s, opacity .9s";
  });
}

/* sky: stars drawn with box-shadow (3 elements only = very light) */
(function sky(){
  const w = innerWidth, h = innerHeight * 1.1, small = w < 720;
  const gen = n => Array.from({length:n}, () => `${(Math.random()*w)|0}px ${(Math.random()*h*.8)|0}px rgba(255,255,255,${(.35+Math.random()*.6).toFixed(2)})`).join(",");
  $(".s1").style.boxShadow = gen(small ? 60 : 120);
  $(".s2").style.boxShadow = gen(small ? 40 : 80);
  $(".s3").style.boxShadow = gen(small ? 14 : 26);
  const dust = $("#dust"), n = small ? 10 : 18;
  for (let i = 0; i < n; i++){
    const b = document.createElement("b");
    b.style.cssText = `left:${Math.random()*100}%;--s:${(2+Math.random()*3).toFixed(1)}px;--t:${(10+Math.random()*10).toFixed(1)}s;--d:${(-Math.random()*20).toFixed(1)}s;--x:${((Math.random()-.5)*120)|0}px`;
    dust.appendChild(b);
  }
})();

/* scroll: parallax, progress, nav — one rAF per frame, transforms only */
const nav = $("#nav"), prog = $("#progress"), moon = $("#moon"), heroIn = $("#heroIn"),
      h1 = $("#h1"), archWrap = $("#archWrap"), h2 = $("#h2"), h3 = $("#h3"), fab = $("#fab"), tabbar = $("#tabbar");
let ticking = false;
function onScroll(){
  const y = scrollY, vh = innerHeight, max = document.documentElement.scrollHeight - vh;
  prog.style.transform = `scaleX(${max > 0 ? y/max : 0})`;
  nav.classList.toggle("solid", y > 40);
  fab.classList.toggle("show", y > vh * .5);
  tabbar.classList.toggle("show", y > 60 || innerWidth <= 720);
  if (!reduce && y < vh * 1.2){
    moon.style.transform = `translate3d(0,${y*.12}px,0)`;
    archWrap.style.transform = `translate3d(0,${y*.08}px,0)`;
    h3.style.transform = `translate3d(0,${y*.18}px,0)`;
    h2.style.transform = `translate3d(0,${y*.1}px,0)`;
    heroIn.style.transform = `translate3d(0,${y*.16}px,0)`;
  }
  ticking = false;
}
addEventListener("scroll", () => { if (!ticking){ ticking = true; requestAnimationFrame(onScroll); } }, { passive:true });
addEventListener("resize", () => requestAnimationFrame(onScroll), { passive:true });

/* pause off-screen animations (battery + no lag) */

  const pause = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("off", !e.isIntersecting)));
  pause.observe($(".hero")); pause.observe($("#marquee"));

  // active tab
  const tabs = {}; $$(".tabbar [data-sec]").forEach(a => tabs[a.dataset.sec] = a);
  const sio = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ Object.values(tabs).forEach(a => a.classList.remove("on")); tabs[e.target.id]?.classList.add("on"); }
  }), { rootMargin:"-45% 0px -50% 0px" });
  ["home","tentang","koleksi","pesan"].forEach(id => sio.observe(document.getElementById(id)));

}

  }), { rootMargin:"300px" });

} else if (!TOKO.cariDiMaps) { $("#map").hidden = true; }

/* lightbox */
const lb = $("#lb"), stage = $("#lbStage"), dots = $("#lbDots"), count = $("#lbCount");
let cur = 0, sx = null, sy = null;
function show(i, dir){
  const n = TOKO.galeri.length; cur = (i + n) % n;
  stage.innerHTML = media(TOKO.galeri[cur], true);
  const im = stage.querySelector("img"); if (im) im.classList.add("ok");

  dots.innerHTML = TOKO.galeri.map((_,k) => `<i class="${k===cur?"on":""}"></i>`).join("");
  count.textContent = `${cur+1} / ${n}`;
  $("#lbWa").href = wa(T[lang].lbMsg(cur+1));
}
function openLb(i){ show(i); lb.classList.add("open"); document.body.classList.add("locked"); }
function closeLb(){ lb.classList.remove("open"); document.body.classList.remove("locked"); }
$("#grid").addEventListener("click", e => { const b = e.target.closest(".tile"); if (b) openLb(+b.dataset.i); });
$(".lb-close").onclick = closeLb;
$(".lb-prev").onclick = () => show(cur-1, -1);
$(".lb-next").onclick = () => show(cur+1, 1);
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
lb.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  else if (dy > 90) closeLb();
  sx = sy = null;
});
addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowRight") show(cur+1, 1);
  if (e.key === "ArrowLeft") show(cur-1, -1);
});

/* language */
$$("#lang button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang; try { localStorage.setItem("ml-lang", lang); } catch(e) {}
  document.body.classList.remove("ready"); render();
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("ready")));
}));

/* boot */
$("#yr").textContent = new Date().getFullYear();
render(); onScroll();
let booted = false;
function boot(){
  if (booted) return; booted = true;
  $("#loader").classList.add("done");
  document.body.classList.remove("locked");
  requestAnimationFrame(() => document.body.classList.add("ready"));
  onScroll();
}
if (reduce) boot();
else { addEventListener("load", () => setTimeout(boot, 450)); setTimeout(boot, 2200); }
